model:
  name: GlucoScope
  version: V3
  expected_parameter_count: 165833
  period_len: 96
  pin: 7
  latent_dim: 64
  global_pooling_hidden: 128
  tokenizer_hidden: 64
  glucose_min: 2.2
  glucose_max: 27.8
  zscore_mean: 7.0
  zscore_std: 3.0
  phase_layers: 2
  phase_attn_heads: 4
  phase_attn_dropout: 0.1
  phase_num_routers: 8
  phase_pos_dropout: 0.0
  reconstruction_hidden: 128
  reconstruction_dropout: 0.0
  reconstruction_n_max: 16
  tau_core: 2.0
  tau_tail: 4.0
  tau_extreme: 7.0
  learnable_tau: false

data:
  materialized_path: dataset/pretrain/dataset.npz
  data_path: dataset/pretrain/agp.csv
  remark_path: dataset/pretrain/remark.csv
  day_count_column: effective_days
  min_day_count: 1.0
  validation_ratio: 0.1
  strict_quantile_order: false

mask:
  ratio_min: 0.30
  ratio_max: 0.40
  point_probability: 0.2
  multi_block_probability: 0.3
  single_block_probability: 0.2
  mixed_probability: 0.3
  min_span: 8
  max_span: 24
  mixed_block_fraction: 0.5

loss:
  calibration_min_days: 8.0
  slope_sigma_floor: 0.1
  slope_weight: 2.0
  visible_loss_weight: 0.1
  reconstruction_weight: 1.0
  hypoglycemia_threshold: 3.9
  hyperglycemia_threshold: 10.0
  extreme_glucose_weight: 2.0
  huber_beta: 0.5

train:
  batch_size: 1024
  epochs: 1000
  learning_rate: 0.001
  minimum_learning_rate: 0.000001
  warmup_epochs: 10
  scheduler: cosine
  weight_decay: 0.00005
  patience: 1001
  minimum_epochs: 1000
  min_delta: 0.0001
  selection_max_samples: 2048
  tensorboard: true
  selection_weights:
    full_all_quantile_mae: 0.35
    masked_median_mae: 0.35
    masked_width_mae: 0.15
    masked_slope_rmse: 0.15
  milestone_epochs: [20, 50, 100, 200, 500, 1000]
  num_workers: 0
  seed: 42
  deterministic: true
  shuffle: true
  use_gpu: true
  gpu: 0

output:
  directory: outputs/checkpoints/V3/pretraining
